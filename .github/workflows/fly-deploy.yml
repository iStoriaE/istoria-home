# Deploys admin.istoria.sa to fly.io on every push to master.
# Needs the repository secret FLY_API_TOKEN (an app-scoped fly deploy token).
name: Deploy to fly.io

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
